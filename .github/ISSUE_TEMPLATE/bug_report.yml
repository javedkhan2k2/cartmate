name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the shared list
        2. Tap "I'm shopping"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - PR preview
        - Local
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app footer or the GitHub release (e.g. v1.2.0)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Least privilege: this job only needs to read the PR.
permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            chore
            ci
            build
            revert
          requireScope: false
          # Subject must start lowercase: "feat: add x", not "feat: Add x"
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
